<div class="game-canvas-wrapper" style="position: relative;">
  <canvas id="gameCanvas" width="9600" height="12800"></canvas>

</div>  
  <canvas id="uiCanvas" width="420" height="800" className="absolute inset-0 z-0"
      style="position: fixed; top: 75px; right: 0; z-index: 10; 
	  background-color: #2b4c68; 
	  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(6, 182, 212, 0.25), transparent 70%), #000000" >
  </canvas>
  <!-- resource UI-->
<canvas id="resourceCanvas" width="0"; height="0"
        style="position: fixed; top: 10px; left: 7%; z-index: 10; 
               background-color: #000000; opacity:0.7;">
</canvas>
  <!-- Notification UI -->
<canvas id="notificationCanvas" 
        style="position: fixed; top: 50px; left: 7%; z-index: 10; 
               background-color: rgba(0,0,0,0.5); /* Optional: see through */">
</canvas>
  <!-- place menu-->

<!-- Arrow section -->
<div class="arrow-dpi-wrapper" style="position: fixed; bottom: 20px; left: 94%; z-index: 1000;">
  <div class="placeArrowContainer">
    <figure class="image is-128x128">
      <img class="is-rounded" src="Pics/plain-arrow.png" />
    </figure>
  </div>
</div>

<!-- Coral section wrapper with ID for easy access -->
<div id="coral-menu-wrapper" class="coral-dpi-wrapper is-hidden" style="position: fixed; bottom: 20px; left: 10%; width: 1000px; z-index: 1000;">

    <div class="coralContainer">
        <!-- dynamic coral components go here -->
    </div>
</div>
<!-- Energy  section wrapper with ID for easy access -->
<div id="energyBuilding-menu-wrapper" class="energyBuilding-dpi-wrapper is-hidden" style="position: fixed; bottom: 20px; left: 10%; width: 1000px; z-index: 1000;">

</div>
